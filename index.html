<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title id="docTitle">国际物流报价</title>
<style>
  :root{
    --navy:#0B1F3A; --blue:#1E56A0; --blue-l:#EAF1FA; --orange:#E8820C; --orange-l:#FDF1E0;
    --teal:#0E7C6B; --teal-l:#E4F4F1; --red:#C43D3D; --red-l:#FBE9E9;
    --ink:#1C2733; --muted:#64748B; --line:#DCE4EE; --bg:#F2F5F9; --card:#FFFFFF;
    --shadow:0 2px 10px rgba(11,31,58,.08);
    --r:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(180deg,#EEF3F9 0%,#F7F9FC 38%,#F2F5F9 100%); color:var(--ink); font-size:15px; line-height:1.55;
  }
  .app{max-width:1080px; margin:0 auto; padding:18px 18px 64px;}
  .top{
    background:linear-gradient(135deg,var(--navy) 0%, #143E78 100%);
    color:#fff; border-radius:var(--r); padding:20px 20px 16px; margin-bottom:16px;
    box-shadow:var(--shadow);
  }
  .top .head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;}
  .top h1{margin:0 0 4px; font-size:22px; letter-spacing:.5px;}
  .top .sub{margin:0; font-size:13px; opacity:.82;}
  .lang-switch{display:inline-flex; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:3px; flex:none;}
  .lang-switch button{
    appearance:none; border:0; background:transparent; color:#fff; font-size:13px; padding:6px 14px;
    border-radius:999px; cursor:pointer; font-family:inherit; opacity:.75;
  }
  .lang-switch button.on{background:#fff; color:var(--navy); opacity:1; font-weight:600;}
  .top .badges{margin-top:10px; display:flex; flex-wrap:wrap; gap:6px;}
  .top .badges span{
    font-size:12px; padding:3px 10px; border-radius:999px;
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25);
  }
  .grid{display:grid; grid-template-columns:1fr 1.15fr; gap:14px; align-items:start;}
  @media (max-width:760px){ .grid{grid-template-columns:1fr;} }
  .card{background:rgba(255,255,255,.96); border:1px solid rgba(205,217,231,.9); border-radius:16px; box-shadow:0 5px 18px rgba(11,31,58,.07); padding:18px 18px 20px; margin-bottom:16px;}
  .card h2{margin:0 0 12px; font-size:16px; display:flex; align-items:center; gap:8px; color:var(--navy);}
  .card h2 .ico{width:24px;height:24px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:var(--blue);flex:none;}
  .f-row{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  @media (max-width:480px){ .f-row{grid-template-columns:1fr 1fr;} .f-row .full{grid-column:1/-1;} }
  .f-row .full{grid-column:1/-1;}
  label{display:block; font-size:13px; color:var(--muted); margin-bottom:4px; line-height:1.4;}
  label .sec{opacity:.72;}
  .inp, select.inp{
    width:100%; padding:10px 11px; font-size:15px; color:var(--ink);
    border:1px solid #C9D6E6; border-radius:11px; background:#fff; outline:none;
    font-family:inherit; transition:border-color .15s, box-shadow .15s;
  }
  .inp:hover, select.inp:hover{border-color:#AFC2DA;}
  .inp:focus, select.inp:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(30,86,160,.15);}
  input.inp[type=number]{-moz-appearance:textfield;}
  input.inp::-webkit-outer-spin-button, input.inp::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .hint{font-size:12px; color:var(--muted); margin-top:5px;}
  .unit-wrap{position:relative;}
  .unit-wrap .u{position:absolute; right:11px; top:50%; transform:translateY(-50%); font-size:12px; color:var(--muted); pointer-events:none;}
  .unit-wrap .inp{padding-right:44px;}
  .btn{
    appearance:none; border:1px solid var(--blue); background:var(--blue); color:#fff;
    font-size:14px; padding:9px 14px; border-radius:10px; cursor:pointer; font-family:inherit;
  }
  .btn.ghost{background:#fff; color:var(--blue);}
  .btn-row{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  details.adv{margin-top:12px; border-top:1px dashed var(--line); padding-top:10px;}
  details.adv summary{cursor:pointer; font-size:13px; color:var(--blue);}
  .chips{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  @media (max-width:520px){ .chips{grid-template-columns:repeat(2,1fr);} }
  .chip{background:var(--blue-l); border:1px solid #C9DCF2; border-radius:10px; padding:9px 10px; text-align:center;}
  .chip .v{font-size:16px; font-weight:600; color:var(--navy);}
  .chip .k{font-size:12px; color:var(--muted); margin-top:2px;}
  .res-card{border-radius:16px; padding:18px; border:1px solid rgba(205,217,231,.92); background:rgba(255,255,255,.98); box-shadow:0 5px 18px rgba(11,31,58,.07); margin-bottom:16px;}
  .res-card .h{display:flex; align-items:center; gap:8px; font-weight:600; font-size:15px; margin-bottom:8px;}
  .dot{width:10px;height:10px;border-radius:50%; flex:none;}
  .air .dot{background:var(--orange);} .sea .dot{background:var(--teal);}
  .sel-tag{font-size:11.5px; font-weight:600; padding:2px 10px; border-radius:999px; margin-left:auto; flex:none;}
  .air .sel-tag{background:var(--orange-l); color:var(--orange);}
  .sea .sel-tag{background:var(--teal-l); color:var(--teal);}
  .price-row{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .price-row .big{font-size:clamp(25px,3vw,32px); font-weight:800; letter-spacing:-.4px; color:var(--navy);}
  .price-row .sub{font-size:13px; color:var(--muted);}
  .price-row .cny{font-size:16px; color:var(--muted);}
  .meta{font-size:12.5px; color:var(--muted); margin-top:6px; line-height:1.6;}
  .unavail{background:var(--red-l); border:1px solid #F2C9C9; border-radius:10px; padding:10px 12px; font-size:13.5px; color:var(--red);}
  .unavail b{font-weight:600;}
  table.fee{width:100%; border-collapse:collapse; font-size:13px; margin-top:8px;}
  table.fee th, table.fee td{padding:6px 8px; border-bottom:1px solid var(--line); text-align:right;}
  table.fee th:first-child, table.fee td:first-child{text-align:left;}
  table.fee th{color:var(--muted); font-weight:500; font-size:12px; background:#F7FAFD;}
  table.fee tr:nth-child(even) td{background:#FAFCFE;}
  table.fee td.total{font-weight:700; color:var(--navy);}
  table.fee td.neg{color:var(--red);}
  .rec{
    border-radius:var(--r); padding:16px 18px; color:#fff; margin-top:14px;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap; box-shadow:var(--shadow);
  }
  .rec.air{background:linear-gradient(135deg,#D97A06,#E8A13A);}
  .rec.sea{background:linear-gradient(135deg,#0C6E5F,#18917F);}
  .rec.only-sea{background:linear-gradient(135deg,#2E4B78,#4A6A9C);}
  .rec .big{font-size:20px; font-weight:700;}
  .rec .why{font-size:13px; opacity:.95;}
  .rec .tag{margin-left:auto; background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.45); padding:4px 12px; border-radius:999px; font-size:13px;}
  .foot{margin-top:18px; font-size:12px; color:var(--muted); line-height:1.7;}
  .foot b{color:#45566B;}
  .foot .src{background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:6px;}
  .sec-t{opacity:.8;}
  .live-badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--orange);color:#fff;flex:none;}
  .ref-badge{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--blue-l);color:var(--blue);flex:none;}
  .live-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
  .live-row{
    display:flex;align-items:center;gap:10px;width:100%;
    border:1px solid var(--line);border-radius:10px;background:#fff;
    padding:8px 11px;cursor:pointer;font-family:inherit;text-align:left;
    transition:border-color .15s, background .15s;
  }
  .live-row:hover{border-color:var(--orange);}
  .live-row.on{background:var(--orange-l);border-color:var(--orange);}
  .live-row .cn{font-weight:600;color:var(--navy);font-size:13px;}
  .live-row .tm{font-size:11.5px;color:var(--muted);}
  .live-row .pr{margin-left:auto;font-weight:700;color:var(--orange);font-size:14px;flex:none;}
  .live-more{font-size:12px;color:var(--muted);margin-top:2px;}
  .fab{
    position:fixed; left:14px; bottom:104px; z-index:60;
    display:flex; align-items:center; gap:8px;
    background:var(--blue); color:#fff; border:0; border-radius:999px;
    padding:13px 18px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;
    box-shadow:0 6px 18px rgba(30,86,160,.38); transition:transform .12s, box-shadow .12s;
  }
  .fab:active{transform:scale(.97);}
  .fab .f-ico{font-size:17px; line-height:1;}
  #toast{
    position:fixed; left:50%; bottom:78px; transform:translateX(-50%); z-index:70;
    background:var(--navy); color:#fff; font-size:13px; padding:9px 16px; border-radius:10px;
    box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .25s; max-width:86vw; text-align:center;
  }
  #toast.show{opacity:1;}
  .set-div{border-top:1px dashed var(--line); margin-top:14px; padding-top:12px;}
  .quote-action{margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .quote-btn{min-width:170px;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:700;padding:12px 20px;background:linear-gradient(135deg,#1E56A0,#2874C6);box-shadow:0 6px 14px rgba(30,86,160,.22);}
  .quote-btn:disabled{opacity:.72;cursor:wait;}
  .quote-spinner{display:none;width:17px;height:17px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:quoteSpin .75s linear infinite;}
  .quote-btn.loading .quote-spinner{display:inline-block;}
  .quote-status{font-size:13px;color:var(--muted);}
  .quote-status.loading{color:var(--blue);font-weight:600;}
  .quote-status.done{color:var(--teal);font-weight:600;}
  .quote-status.error{color:var(--red);font-weight:600;}
  @keyframes quoteSpin{to{transform:rotate(360deg);}}
  .dims-row{grid-template-columns:repeat(3,1fr)!important;}
  @media (max-width:760px){
    .app{padding:8px 8px 84px;}
    .top{border-radius:12px;padding:17px 16px 14px;margin-bottom:10px;}
    .top h1{font-size:20px;}
    .card,.res-card{border-radius:13px;padding:15px;margin-bottom:10px;}
    .quote-action{display:block;}
    .quote-btn{width:100%;}
    .quote-status{display:block;margin-top:8px;text-align:center;}
    .fab{left:10px;right:10px;bottom:10px;justify-content:center;border-radius:12px;padding:12px 16px;}
  }
  @media (max-width:420px){
    .dims-row{grid-template-columns:1fr!important;}
    .chips{gap:6px;}
    .chip{padding:8px 6px;}
    .price-row .big{font-size:25px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="head">
      <div>
        <h1 id="topTitle">国际物流报价</h1>
        <p class="sub" id="topSub">输入产品与货量，自动计算整票空运/海运 DAP 价格并推荐运输方式</p>
      </div>
      <div class="lang-switch" id="langSwitch" role="group" aria-label="语言">
        <button type="button" id="langZh">中文</button>
        <button type="button" id="langEn">English</button>
      </div>
    </div>
    <div class="badges"><span id="badge1">电脑 · 平板 · 手机通用</span><span id="badge2">数据：外贸报价与出口退税利润决策系统</span></div>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <h2><span class="ico" id="icoCargo">货</span><span id="hCargo">货物信息</span></h2>
        <div class="f-row">
          <div class="full">
            <label for="product" id="lProduct"></label>
            <select id="product" class="inp"></select>
            <div class="hint" id="prodInfo"></div>
          </div>
          <div class="full" style="margin-top:2px;">
            <label id="lDims"></label>
            <div class="f-row dims-row" style="gap:8px;">
              <div class="unit-wrap"><input id="len" class="inp" type="number" min="0.1" step="0.1"><span class="u">cm</span></div>
              <div class="unit-wrap"><input id="wid" class="inp" type="number" min="0.1" step="0.1"><span class="u">cm</span></div>
              <div class="unit-wrap"><input id="hei" class="inp" type="number" min="0.1" step="0.1"><span class="u">cm</span></div>
            </div>
          </div>
          <div class="unit-wrap"><label for="wgt" id="lWgt"></label><input id="wgt" class="inp" type="number" min="0.001" step="0.001"><span class="u">kg</span></div>
          <div class="unit-wrap"><label for="qty" id="lQty"></label><input id="qty" class="inp" type="number" min="1" step="1"><span class="u" id="qtyUnit">件</span></div>
        </div>
        <div class="btn-row">
          <button type="button" class="btn ghost" id="loadSample">填入示例（加热眼罩 42 件）</button>
        </div>
        <details class="adv">
          <summary id="sAdv">包装参数（高级） / Packing parameters (advanced)</summary>
          <div class="f-row" style="margin-top:8px;">
            <div class="unit-wrap"><label for="ppc" id="lPpc"></label><input id="ppc" class="inp" type="number" min="1" step="1" value="46"><span class="u" id="ppcUnit">件/箱</span></div>
            <div class="unit-wrap"><label for="boxWt" id="lBoxWt"></label><input id="boxWt" class="inp" type="number" min="1" step="0.1" value="17"><span class="u">kg</span></div>
          </div>
          <div class="f-row" style="margin-top:8px;">
            <div class="unit-wrap"><label for="boxL" id="lBoxL"></label><input id="boxL" class="inp" type="number" min="1" step="0.1" value="53"><span class="u">cm</span></div>
            <div class="unit-wrap"><label for="boxW" id="lBoxW"></label><input id="boxW" class="inp" type="number" min="1" step="0.1" value="27.5"><span class="u">cm</span></div>
            <div class="unit-wrap"><label for="boxH" id="lBoxH"></label><input id="boxH" class="inp" type="number" min="1" step="0.1" value="48"><span class="u">cm</span></div>
          </div>
        </details>
      </div>

      <div class="card">
        <h2><span class="ico" id="icoDest">港</span><span id="hDest">目的地</span></h2>
        <label for="dest" id="lDest"></label>
        <select id="dest" class="inp"></select>
        <div class="hint" id="destHint"></div>
        <div class="quote-action">
          <button type="button" class="btn quote-btn" id="quoteBtn"><span class="quote-spinner" aria-hidden="true"></span><span id="quoteBtnText">查看报价</span></button>
          <span class="quote-status" id="quoteStatus">修改参数后，请点击查看报价</span>
        </div>
        <div style="margin-top:12px;">
          <label for="mode" id="lMode"></label>
          <select id="mode" class="inp">
            <option value="air"></option>
            <option value="sea"></option>
          </select>
          <div class="hint" id="modeHint"></div>
        </div>
        <div class="set-div">
          <label id="lCompany"></label>
          <input id="company" class="inp" type="text" value="博恩凝 BONING">
          <div class="unit-wrap" style="margin-top:10px;">
            <label id="lMargin"></label>
            <input id="margin" class="inp" type="number" min="1" max="90" step="1" value="30"><span class="u">%</span>
          </div>
          <div class="hint" id="quotaHint"></div>
        </div>
                <details class="adv" id="apiSet" hidden>
          <summary id="sApi"></summary>
          <div style="margin-top:8px;">
            <label for="esProxy" id="lEsProxy"></label>
            <input id="esProxy" class="inp" type="text" autocomplete="off">
            <div class="hint" id="esTokenHint"></div>
            <div class="f-row" style="margin-top:8px;">
              <div class="unit-wrap"><label for="esDestPost" id="lEsDestPost"></label><input id="esDestPost" class="inp" type="text"></div>
              <div class="unit-wrap"><label for="esStatus" id="lEsStatus"></label><input id="esStatus" class="inp" type="text" readonly style="background:#F4F7FB;color:var(--muted);"></div>
            </div>
            <div class="f-row" style="margin-top:8px;">
              <div class="unit-wrap"><label for="esSeaToken" id="lEsSeaToken"></label><input id="esSeaToken" class="inp" type="password" autocomplete="off"></div>
              <div class="unit-wrap"><label for="esSeaStatus" id="lEsSeaStatus"></label><input id="esSeaStatus" class="inp" type="text" readonly style="background:#F4F7FB;color:var(--muted);"></div>
            </div>
            <div class="hint" id="esSeaHint"></div>
            <div class="f-row" style="margin-top:8px;">
              <div class="unit-wrap"><label for="esEsToken" id="lEsEsToken"></label><input id="esEsToken" class="inp" type="password" autocomplete="off"></div>
              <div class="unit-wrap"><label for="esEsStatus" id="lEsEsStatus"></label><input id="esEsStatus" class="inp" type="text" readonly style="background:#F4F7FB;color:var(--muted);"></div>
            </div>
            <div class="unit-wrap" style="margin-top:8px;"><label for="esEsProxy" id="lEsEsProxy"></label><input id="esEsProxy" class="inp" type="text" autocomplete="off" placeholder="https://your-worker.workers.dev"></div>
            <div class="hint" id="esEsHint"></div>
            <div class="btn-row">
              <button type="button" class="btn ghost" id="saveApi"></button>
            </div>
            <div class="hint" id="apiStatus"></div>
          </div>
        </details>
      </div>
    </div>

    <div id="results">
      <div class="card" style="padding-bottom:16px;">
        <h2><span class="ico" id="icoCalc">算</span><span id="hCalc">整票货量</span></h2>
        <div class="chips">
          <div class="chip"><div class="v" id="rVol">–</div><div class="k" id="kV">总体积 / Volume</div></div>
          <div class="chip"><div class="v" id="rWt">–</div><div class="k" id="kW">总毛重 / Gross Wt</div></div>
          <div class="chip"><div class="v" id="rBox">–</div><div class="k" id="kB">折算箱数 / Cartons</div></div>
          <div class="chip"><div class="v" id="rRT">–</div><div class="k" id="kR">计费RT / Chargeable RT</div></div>
        </div>
        <div id="recArea"></div>
      </div>

      <div id="airCard"></div>
      <div id="seaCard"></div>
    </div>
  </div>

  <div class="foot">
    <div class="src" id="footSrc"></div>
    <div id="footDate" style="margin-top:6px;">报价小程序 · Generated 2026-08-02</div>
  </div>
</div>
<button type="button" id="exportBtn" class="fab"><span class="f-ico">📄</span><span id="fabLabel">导出报价单</span></button>
<div id="toast"></div>

<script>
"use strict";
/* ================= 数据（来自用户提供的两个表格） ================= */
var USDCNY = 6.7899;
/* 傻瓜式内置配置：用户只需选择城市，系统自动使用对应市中心邮编并走统一 Worker。 */
var PX_DEFAULT = {
  server:"https://flextherm-shipping.flextherm0601.workers.dev",
  destPost:"",
  seaToken:"",
  esToken:"",
  esProxy:""
};
var liveAirState = null; /* {loading, rates, err, fetchedAt, dest, key, selected} */
var liveSeaState = null; /* {loading, rates, err, fetchedAt, dest, key} */
var airCtx = null;
var quoteInProgress = false;
var quoteDirty = true;

var PRODUCTS = [
  {name:"加热眼罩", nameEn:"Heating Eye Mask", cat:"个护", catEn:"Personal Care", costCNY:66.783, costUSD:9.8938, len:21.5, wid:14, hei:4.2, wgt:0.314, boxQty:46},
  {name:"加热腰带男款", nameEn:"Heating Belt (Men's)", cat:"个护", catEn:"Personal Care", costCNY:62.715, costUSD:9.2911},
  {name:"腕部按摩仪", nameEn:"Wrist Massager", cat:"个护", catEn:"Personal Care", costCNY:68.365, costUSD:10.1281},
  {name:"雪中行加热腰带（女款蓝色，澳规插头）", nameEn:"Heating Belt (Women's Blue, AU Plug)", cat:"个护", catEn:"Personal Care", costCNY:111.305, costUSD:16.4896},
  {name:"亚马逊——暖宫腰带", nameEn:"Warm Waist Belt (Amazon)", cat:"个护", catEn:"Personal Care", costCNY:79.665, costUSD:11.8022},
  {name:"肩颈加热垫", nameEn:"Shoulder & Neck Heating Pad", cat:"个护", catEn:"Personal Care", costCNY:90.7955, costUSD:13.4512},

/* ================= 实时报价设置（4PX） ================= */
function storeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function storeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function workerUrl(base, path){
  base = String(base || "").trim();
  if (!base) return path;
  base = base.replace(/\/+$/, "");
  /* 兼容用户误填完整接口地址；设置中推荐只填 workers.dev 根地址。 */
  base = base.replace(/\/api\/(health|4px\/quote|es\/rates)$/i, "");
  return base + path;
}

function esSettings(){
  var s = {};
  for (var k in PX_DEFAULT) s[k] = PX_DEFAULT[k];
  var raw = storeGet("esSettings");
  if (raw) {
    try { var o = JSON.parse(raw); for (var k2 in o) if (k2 in s) s[k2] = o[k2]; } catch(e){}
  }
  /* 固定安全代理并始终按所选城市使用内置邮编，避免旧浏览器设置造成 404/405。 */
  s.server = PX_DEFAULT.server;
  s.esProxy = PX_DEFAULT.esProxy;
  s.destPost = "";
  return s;
}
function saveEsSettings(){
  var s = {
    server: $("esProxy").value.trim(),
    destPost: $("esDestPost").value.trim(),
    seaToken: $("esSeaToken").value.trim(),
    esToken: $("esEsToken").value.trim(),
    esProxy: $("esEsProxy").value.trim()
  };
  storeSet("esSettings", JSON.stringify(s));
  $("apiStatus").textContent = T("设置已保存，正在刷新报价…", "Settings saved, refreshing quotes…");
  checkServerStatus();
  checkSeaStatus();
  checkEsStatus();
  calc();
}
function loadEsSettingsToForm(){
  var s = esSettings();
  $("esProxy").value = s.server;
  $("esDestPost").value = s.destPost;
  $("esSeaToken").value = s.seaToken;
  $("esEsToken").value = s.esToken || "";
  $("esEsProxy").value = s.esProxy || "";
  checkServerStatus();
  checkSeaStatus();
  checkEsStatus();
}
function checkServerStatus(){
  var s = esSettings();
  var url = workerUrl(s.server, "/api/health");
  if (!$("esStatus")) return;
  $("esStatus").value = T("检测中…", "Checking…");
  fetch(url, {method: "GET"})
    .then(function(r){ return r.json().catch(function(){ return {}; }); })
    .then(function(j){
      if (j && j.ok) {
        $("esStatus").value = j.configured
          ? T("已连接 · 4PX 已配置", "Connected · 4PX configured")
          : T("已连接 · 4PX 未配置（见 config.js）", "Connected · 4PX not configured (see config.js)");
      } else {
        $("esStatus").value = T("无法连接服务，请先运行 node server.js", "Cannot reach server; run node server.js first");
      }
    })
    .catch(function(){
      $("esStatus").value = T("无法连接服务，请先运行 node server.js", "Cannot reach server; run node server.js first");
    });
}

/* ================= 实时空运报价（4PX 预估费用接口） ================= */
function liveKey(){
  var L = num("len"), W = num("wid"), H = num("hei"), wt = num("wgt"), qty = num("qty");
  var ppc = num("ppc") || 46, boxL = num("boxL") || 53, boxW = num("boxW") || 27.5, boxH = num("boxH") || 48, boxWt = num("boxWt") || 17;
  return destSel.value + "|" + qty + "|" + wt + "|" + L + "x" + W + "x" + H + "|" + ppc + "|" + boxL + "x" + boxW + "x" + boxH + "|" + boxWt;
}
function rateFX(cur){
  var s = esSettings();
  if (cur === "CNY") return 1;
  if (cur === "AUD") return parseFloat(s.audRate) || 4.5;
  return USDCNY; /* USD 及未识别币种 */
}
function liveToCNY(r){ return r.total * rateFX(r.cur); }
function liveBestRate(){
  if (!liveAirState || !liveAirState.rates || !liveAirState.rates.length) return null;
  if (liveAirState.dest !== destSel.value || liveAirState.key !== liveKey()) return null;
  var i = Math.min(liveAirState.selected || 0, liveAirState.rates.length - 1);
  return liveAirState.rates[i] || null;
}
function currentAirCNY(){
  var live = liveBestRate();
  if (live) return liveToCNY(live);
  var airInfo = AIR[destSel.value];
  return airInfo ? airInfo.perPiece * num("qty") : NaN;
}
function airSelectable(){
  if (liveBestRate()) return true;
  var airInfo = AIR[destSel.value];
  if (!airInfo) return false;

/* 海运估算：1 RT 样本整票报价按计费 RT 保守同比例折算；最低计费 1 RT。 */
function seaQuote(sea, rt){
  var seaRT = Math.max(rt, 1);
  var fixedBase = 0, i;
  for (i = 0; i < SEA_FIXED_KEYS.length; i++) fixedBase += (sea.fees[SEA_FIXED_KEYS[i]] || 0);
  var asc = sea.fees.asc || 0;
  var fixedScaled = fixedBase * seaRT;
  var totalUSD = (sea.total || (fixedBase + asc + (sea.seaSub || 0))) * seaRT;
  return { rt: seaRT, fixed: fixedBase, fixedScaled: fixedScaled, asc: asc, totalUSD: totalUSD };
}

/* ================= 计算 ================= */
function calc(skipFetch){

    $("rVol").textContent = "–"; $("rWt").textContent = "–"; $("rBox").textContent = "–"; $("rRT").textContent = "–";
    $("recArea").innerHTML = "";
    $("airCard").innerHTML = ""; $("seaCard").innerHTML = "";
    $("destHint").textContent = "";
    return;
  }

  var cartons = Math.max(1, Math.ceil(qty / ppc));
  var volCm3 = L * W * H * qty;

  var volM3 = (boxL * boxW * boxH / 1e6) * (qty / ppc);
  var grossKg = boxWt * (qty / ppc);
  var rt = Math.max(volM3, grossKg / 1000, 1);

  $("rVol").textContent = fmt(volM3, 4);
  $("rWt").textContent = fmt(grossKg, 1);
  $("rBox").textContent = fmt(cartons, 0);
  $("rRT").textContent = fmt(rt, 2);

  var boxVol = boxL * boxW * boxH;
  var airFit = volCm3 <= boxVol && grossKg <= boxWt;
  var airInfo = AIR[dest];
  var sea = SEA[dest];
  var sq = seaQuote(sea, rt);
  var liveSea = seaLiveBest();
  var seaCNY = liveSea ? (liveToCNY(liveSea) + sq.fixed * USDCNY) : sq.totalUSD * USDCNY;
  var seaUSD = seaCNY / USDCNY;

  var airReasons = [];
  if (!airInfo) airReasons.push(T("该港口暂无内置空运参考价（配置实时报价后可查询）", "No built-in air rate for this port (live quotes available once configured)"));
  if (airInfo && !airFit) {
    if (volCm3 > boxVol) airReasons.push(T("整票总体积超过内置空运上限", "Total volume exceeds the built-in air limit") + " (" + boxL + "×" + boxW + "×" + boxH + "cm)");
    if (grossKg > boxWt) airReasons.push(T("整票总毛重超过内置空运上限", "Total gross weight exceeds the built-in air limit") + " (" + fmt(boxWt,0) + "kg)");
  }
  var live = liveBestRate();
  var airOK = airSelectable();
  var airCNY = live ? liveToCNY(live) : (airInfo ? airInfo.perPiece * qty : 0);
  var airUSD = airCNY / USDCNY;
  var rec;
  if (!airOK) {
    rec = {cls:"only-sea", title:T("海运","Sea Freight"), tag:T("仅可海运","Sea only"), why: airReasons.join("；")};
  } else {
    var airCur = LANG === "zh" ? airCNY : airUSD;
    var seaCur = LANG === "zh" ? seaCNY : seaUSD;
    rec = (seaCur < airCur)
      ? {cls:"sea", title:T("海运","Sea Freight"), tag:T("价格更低","Lower price"), why:T("整票海运","Sea total") + " " + fmtMoney(seaCNY, seaUSD, 2) + " < " + T("空运","Air") + " " + fmtMoney(airCNY, airUSD, 2)}
      : {cls:"air", title:T("空运","Air Freight"), tag:T("价格更低","Lower price"), why:T("整票空运","Air total") + " " + fmtMoney(airCNY, airUSD, 2) + " ≤ " + T("海运","Sea") + " " + fmtMoney(seaCNY, seaUSD, 2) + (live ? "（" + T("实时报价","live quote") + "）" : "（" + T("货量在内置空运限制内","shipment within the built-in air limits") + "）")};
  }
  var airOpt = modeSel.options[0];
  airOpt.disabled = !airOK;
  if (modeSel.value === "air" && !airOK) modeSel.value = "sea";
  if (modeSel.value !== "air" && modeSel.value !== "sea") modeSel.value = (rec.cls === "air" ? "air" : "sea");
  $("modeHint").textContent = airOK
    ? T("空运与海运均可选择，报价单将按所选运输方式导出", "Both Air and Sea are selectable; the quotation exports with your selected mode")
    : T("当前无法选择空运（未配置实时报价或货量超内置空运限制），仅可选择海运", "Air currently unavailable (no live quote configured or shipment over the built-in air limit); sea freight only");

  airCtx = {dest: dest, destLbl: destLbl, airInfo: airInfo, airOK: airOK, airReasons: airReasons, qty: qty};
  renderRec(rec);
  renderAir();
  renderSea(sea, sq, destLbl, qty);

  var hasLiveCfg = true;
  var hint;
  if (live) {
    hint = T("空运为 4PX 官方实时试算报价（空运/快递/小包/专线，含末端派送估算）", "Air quote is live from the 4PX official quote API (air/express/parcel/line-haul, incl. last-mile estimate)");
  } else if (hasLiveCfg && liveAirState && liveAirState.loading && liveAirState.dest === dest) {
    hint = T("正在获取实时空运报价…", "Fetching live air quotes…");
  } else if (airInfo) {
    hint = airFit
      ? T("该港口可空运：整票 ≤ ","Air available: whole shipment ≤ ") + boxL + "×" + boxW + "×" + boxH + "cm " + T("且","and") + " ≤ " + fmt(boxWt,0) + "kg"
      : T("内置空运上限：","Built-in air limit: ") + boxL + "×" + boxW + "×" + boxH + "cm / " + fmt(boxWt,0) + "kg";
  } else {
    hint = T("内置空运价仅覆盖悉尼、墨尔本；配置实时报价后四港均可查询", "Built-in air rates cover Sydney & Melbourne only; all four ports can be quoted once live rates are configured");
  }
  $("destHint").textContent = hint;
  /* 实时接口只在用户点击“查看报价”后调用，避免输入过程中反复请求。 */
}

        '<div class="live-list">';
      es.rates.forEach(function(r, idx){

      });
      html += '</div>';
    } else if (es.err) {
      html += '<div class="meta" style="color:var(--red);margin-top:10px;">' + T("Easyship 实时报价不可用：","Easyship live quote unavailable: ") + xmlE(es.err) + '</div>';

/* ================= 报价单导出（Excel） ================= */
function dstr(dt){ var m=("0"+(dt.getMonth()+1)).slice(-2), d=("0"+dt.getDate()).slice(-2); return dt.getFullYear()+"-"+m+"-"+d; }
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,""); }
function xmlE(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;"); }

function computeQuotation(){
  var L=num("len"),W=num("wid"),H=num("hei"),wt=num("wgt"),qty=num("qty");
  if(!(L>0&&W>0&&H>0&&wt>0&&qty>=1)){
    return {ok:false, msg:T("请先填写完整的产品尺寸、重量和数量","Please fill in product dimensions, weight and quantity first")};
  }
  var ppc=num("ppc")||46, boxL=num("boxL")||53, boxW=num("boxW")||27.5, boxH=num("boxH")||48, boxWt=num("boxWt")||17;
  var dest=destSel.value;
  var p=PRODUCTS.find(function(x){return x.name===productSel.value;}) || PRODUCTS[0];
  var volCm3=L*W*H*qty, volM3=volCm3/1e6, gross=wt*qty;
  var boxVol=boxL*boxW*boxH;
  var airFit=volCm3<=boxVol && gross<=boxWt;
  var airInfo=AIR[dest], sea=SEA[dest];
  var liveRate=liveBestRate();
  var airCNY=liveRate? liveToCNY(liveRate) : (airInfo? airInfo.perPiece*qty : 0);
  var airUSD=airCNY/USDCNY;
  var sq=seaQuote(sea, Math.max(volM3, gross/1000, 1));
  var liveSea=seaLiveBest();
  var seaCNY=liveSea ? (liveToCNY(liveSea)+sq.fixed*USDCNY) : sq.totalUSD*USDCNY;
  var seaUSD=liveSea ? (liveSea.total*rateFX(liveSea.cur)/USDCNY+sq.fixed) : sq.totalUSD;
  var airOK=airSelectable();
  var seaCur=LANG==="zh"?seaCNY:seaUSD;
  var airCur=LANG==="zh"?airCNY:airUSD;
  var mode = (modeSel.value === "air" && airOK) ? "air" : "sea";
  var mainCNY, mainUSD, method, transit, basis;
  if(mode==="air"){
    if(liveRate){
      mainCNY=liveToCNY(liveRate); mainUSD=mainCNY/USDCNY;
      method=T("空运（DAP）","Air Freight (DAP)");
      transit=(liveRate.maxT?liveRate.minT+"-"+liveRate.maxT:liveRate.minT)+" "+T("（"+liveRate.name+"）","("+liveRate.name+")");
      basis=LANG==="zh"
        ? "4PX 官方试算："+liveRate.name+" "+fmt(liveRate.total,2)+" "+liveRate.cur+"（"+liveRate.incoterms+"，"+(liveRate.maxT?liveRate.minT+"-"+liveRate.maxT:liveRate.minT)+"，查询于 "+fmtTime(liveAirState.fetchedAt)+"，按单箱试算×箱数估算）"
        : "4PX official quote: "+liveRate.name+" "+fmt(liveRate.total,2)+" "+liveRate.cur+" ("+liveRate.incoterms+", "+(liveRate.maxT?liveRate.minT+"-"+liveRate.maxT:liveRate.minT)+", fetched "+fmtTime(liveAirState.fetchedAt)+", per-carton estimate × cartons)";
    } else {
      mainCNY=airCNY; mainUSD=airUSD;
      method=T("空运（DAP）","Air Freight (DAP)");
      transit=T("3-5 工作日","3-5 business days");
      basis=LANG==="zh"
        ? "空运费率（内置参考价，非实时）：整箱 1079.59 CNY / 46 片，按单片 × 数量计"
        : "Air rate (built-in reference, not live): "+fmt(1079.59/USDCNY,2)+" USD per carton / 46 pcs, charged per piece × qty";
    }
  } else {
    mainCNY=seaCNY; mainUSD=seaUSD;
    method=T("海运（DAP）","Sea Freight (DAP)");
    transit=sea.schedule+" "+T("（船期，以船公司为准）","(schedule, subject to carrier)");
    basis=LANG==="zh"
      ? (liveSea
          ? "SeaRates 实时 LCL 海运价（"+liveSea.provider+"，"+fmt(liveSea.total,2)+" "+liveSea.cur+"，含港口杂费，查询于 "+fmtTime(liveSeaState.fetchedAt)+"）+ 货代目的港固定费用 "+fmt(sq.fixed,2)+" USD；合计（估算）"+fmt(seaCNY,2)+" CNY"
          : "海运按货代报价单折算估算 "+fmt(seaCNY,2)+" CNY（报价单号 "+sea.ref+"，按计费 "+fmt(sq.rt,2)+" RT，最低 1 RT）")
      : (liveSea
          ? "SeaRates live LCL rate ("+liveSea.provider+", "+fmt(liveSea.total,2)+" "+liveSea.cur+", incl. port fees, fetched "+fmtTime(liveSeaState.fetchedAt)+") + forwarder destination fees "+fmt(sq.fixed,2)+" USD; total (est.) "+fmt(seaUSD,2)+" USD"
          : "Sea freight scaled estimate "+fmt(seaUSD,2)+" USD (Quote No. "+sea.ref+", chargeable "+fmt(sq.rt,2)+" RT, min 1 RT)");
  }
  var cur=LANG==="zh"?"CNY":"USD";
  var unitCost=LANG==="zh"?(p.costCNY||0):(p.costUSD||0);
  var hasCost=!!p.costCNY;
  var margin=(num("margin")||30)/100;
  var mainCur=LANG==="zh"?mainCNY:mainUSD;
  var unitFreight=mainCur/qty;
  var unitPrice=(unitCost+unitFreight)/(1-margin);
  var total=unitPrice*qty;
  /* Product Cost = 不含税成本 + 增值税(13%进项税) + 目标利润 = 含税成本 + 目标利润 */
  var unitProductCost=unitCost+unitPrice*margin;
  var productCostTotal=unitProductCost*qty;
  var now=new Date();
  var ymd=dstr(now);
  var validDate=new Date(now.getTime()+7*864e5);
  var qno="QUO-"+ymd.replace(/-/g,"")+"-"+Math.floor(100+Math.random()*900);
  var prodLbl=LANG==="zh" ? p.name : (p.nameEn||p.name);
  var destLbl=LANG==="zh" ? dest : DEST_EN[dest];
  var airReasons=[];
  if(!airInfo) airReasons.push(T("该港口暂无内置空运参考价（配置实时报价后可查询）","No built-in air rate for this port (live quotes available once configured)"));
  if(airInfo&&!airFit) airReasons.push(T("货量超内置空运限制（≤53×27.5×48cm 且 ≤17kg）","Shipment exceeds built-in air limits (≤53×27.5×48cm and ≤17kg)"));
  var notes=[];
  notes.push(T("贸易条款：卖方承担运至指定地点费用；卖方不承担进口清关、关税及 GST","Seller bears cost to the named place. Seller does not bear import clearance, duties and GST"));
  notes.push(T("报价有效期：7 天（"+ymd+" 至 "+dstr(validDate)+"）","Validity: 7 days ("+ymd+" to "+dstr(validDate)+")"));
  notes.push(T("价格基于当前运费与汇率 USD/CNY = 6.7899；最终费用以货代确认为准","Prices based on current freight and FX rate USD/CNY = 6.7899; final charges subject to forwarder confirmation"));
  if(!hasCost) notes.push(T("注意：该产品含税成本待补充，单价按成本 0 计算","Note: product tax-incl. cost is pending; unit price calculated with cost = 0"));
  if(mode==="air"){
    if(liveRate) notes.push(T("空运价格为 4PX 官方试算报价（"+liveRate.name+"，"+liveRate.cur+"，查询于 "+fmtTime(liveAirState.fetchedAt)+"，按单箱试算×箱数估算）；实际费用以平台下单确认为准","Air price is an official 4PX quote ("+liveRate.name+", "+liveRate.cur+", fetched "+fmtTime(liveAirState.fetchedAt)+", per-carton estimate × cartons); final charges subject to booking confirmation"));
    else notes.push(T("空运价格为内置参考价（非实时），实际价格以物流平台实时报价为准","Air price is a built-in reference (not live); actual price subject to the logistics platform's live quote"));
  }
  if(mode==="sea"&&airOK) notes.push(T("参考：空运整票 "+fmtMoney(airCNY,airUSD,2)+(liveRate?"（4PX 实时）":"（如符合内置空运限制）"),"Air total (reference) "+fmtMoney(airCNY,airUSD,2)+(liveRate?" (4PX live)":" (if within built-in air limits)")));
  if(mode==="air") notes.push(T("参考：海运整票（备选方案）"+fmtMoney(seaCNY,seaUSD,2),"Sea freight reference (whole shipment, alternative): "+fmtMoney(seaCNY,seaUSD,2)));
  if(mode==="sea") notes.push(liveSea
    ? T("海运为 SeaRates 实时 LCL 报价（"+liveSea.provider+"，"+fmt(liveSea.total,2)+" "+liveSea.cur+"，含起运/目的港杂费，查询于 "+fmtTime(liveSeaState.fetchedAt)+"，时效 "+(liveSea.transit||"—")+" 天，有效期 "+(liveSea.validityFrom||"—")+" ~ "+(liveSea.validityTo||"—")+"）+ 货代目的港固定费用 "+fmt(sq.fixed,2)+" USD；合计为估算，实际以货代确认为准","Sea freight is a live SeaRates LCL quote ("+liveSea.provider+", "+fmt(liveSea.total,2)+" "+liveSea.cur+", incl. origin/destination port fees, fetched "+fmtTime(liveSeaState.fetchedAt)+", transit "+(liveSea.transit||"—")+" days, valid "+(liveSea.validityFrom||"—")+" ~ "+(liveSea.validityTo||"—")+") + forwarder destination fees "+fmt(sq.fixed,2)+" USD; total is an estimate, subject to forwarder confirmation")
    : T("海运费用按货代报价单折算估算（报价单号 "+sea.ref+"）：ASC 与海运小计按计费 RT 折算，其余为整票固定费用，当前计费 "+fmt(sq.rt,2)+" RT（最低 1 RT）；实际以货代确认为准","Sea freight scaled from forwarder quote (Quote No. "+sea.ref+"): ASC & sea subtotal scale by chargeable RT, other fees fixed per shipment, current "+fmt(sq.rt,2)+" RT (min 1 RT); subject to forwarder confirmation"));
  var zhSan = function(s){ return String(s).replace(/[\\\/:*?"<>|\s]+/g,"-").replace(/^-+|-+$/g,""); };
  var fileName = LANG==="zh"
    ? "报价单_"+zhSan(p.name)+"_"+zhSan(dest)+"_"+ymd+".xlsx"
    : "QUOTATION_"+slug(p.nameEn||p.name)+"_"+slug(DEST_EN[dest]||dest)+"_"+ymd+".xlsx";
  return {
    ok:true, company:($("company").value.trim()||"博恩凝 BONING"),
    qno:qno, date:ymd, valid:dstr(validDate), qty:qty, pcsUnit:T("件","pcs"),
    product:prodLbl, dest:destLbl, method:method, transit:transit, marginPct:Math.round(margin*100),
    cur:cur, unitCost:unitCost, hasCost:hasCost,
    unitProductCost:unitProductCost, productCostTotal:productCostTotal,
    unitFreight:unitFreight, freightTotal:mainCur, unitPrice:unitPrice, total:total,
    basis:basis, notes:notes, airReasons:airReasons,
    rec:mode, mode:mode, destKey:dest, live:!!liveRate, courier:liveRate?liveRate.name:"", fileName:fileName
  };
}

/* --- 极简 XLSX 写入器（ZIP 无压缩存储，纯前端） --- */
var crcTable=(function(){var t=[],c,n,k;for(n=0;n<256;n++){c=n;for(k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(bytes){var c=0xFFFFFFFF,i;for(i=0;i<bytes.length;i++)c=crcTable[(c^bytes[i])&0xFF]^(c>>>8);return(c^0xFFFFFFFF)>>>0;}
function zipStore(entries){
  var enc=new TextEncoder(), parts=[], central=[], offset=0, i, e, nb, lh, dv, ch, cdv, crc;
  for(i=0;i<entries.length;i++){
    e=entries[i]; nb=enc.encode(e.name);
    lh=new Uint8Array(30+nb.length); dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0x0800,true);
    dv.setUint16(8,0,true); dv.setUint16(10,0,true); dv.setUint16(12,0,true);
    crc=crc32(e.data); dv.setUint32(14,crc,true);
    dv.setUint32(18,e.data.length,true); dv.setUint32(22,e.data.length,true);
    dv.setUint16(26,nb.length,true); dv.setUint16(28,0,true);
    lh.set(nb,30); parts.push(lh); parts.push(e.data);
    ch=new Uint8Array(46+nb.length); cdv=new DataView(ch.buffer);
    cdv.setUint32(0,0x02014b50,true); cdv.setUint16(4,20,true); cdv.setUint16(6,20,true); cdv.setUint16(8,0x0800,true);
    cdv.setUint16(10,0,true); cdv.setUint16(12,0,true); cdv.setUint16(14,0,true);
    cdv.setUint32(16,crc,true); cdv.setUint32(20,e.data.length,true); cdv.setUint32(24,e.data.length,true);
    cdv.setUint16(28,nb.length,true); cdv.setUint16(30,0,true); cdv.setUint16(32,0,true);
    cdv.setUint16(34,0,true); cdv.setUint16(36,0,true); cdv.setUint32(38,0,true); cdv.setUint32(42,offset,true);
    ch.set(nb,46); central.push(ch); offset+=lh.length+e.data.length;
  }
  var cdSize=0; for(i=0;i<central.length;i++) cdSize+=central[i].length;
  var eocd=new Uint8Array(22), edv=new DataView(eocd.buffer);
  edv.setUint32(0,0x06054b50,true); edv.setUint16(4,0,true); edv.setUint16(6,0,true);
  edv.setUint16(8,entries.length,true); edv.setUint16(10,entries.length,true);
  edv.setUint32(12,cdSize,true); edv.setUint32(16,offset,true); edv.setUint16(20,0,true);
  var all=parts.concat(central,[eocd]), total=0, pos=0;
  for(i=0;i<all.length;i++) total+=all[i].length;
  var out=new Uint8Array(total);
  for(i=0;i<all.length;i++){ out.set(all[i],pos); pos+=all[i].length; }
  return out;
}

function quotationSheetXml(d){
  var cur=d.cur;
  var C=function(ref,v,s){return '<c r="'+ref+'" s="'+s+'"><v>'+v+'</v></c>';};
  var Txt=function(ref,v,s){return '<c r="'+ref+'" t="inlineStr" s="'+s+'"><is><t xml:space="preserve">'+xmlE(v)+'</t></is></c>';};
  var meta=[
    [T("报价单号","Quotation No."), d.qno, T("日期","Date"), d.date],
    [T("有效期至","Valid Until"), d.valid, T("运输方式","Shipping Method"), d.method],
    [T("产品","Product"), d.product, T("数量","Quantity"), d.qty+" "+d.pcsUnit],
    [T("目的地","Destination"), d.dest, T("贸易条款","Incoterm"), "DAP"],

  var rows=['<row r="1" ht="34" customHeight="1">'+Txt("A1",d.company,1)+'</row>',

  meta.forEach(function(m,idx){
    var r=4+idx;
    rows.push('<row r="'+r+'">'+Txt("A"+r,m[0],3)+Txt("B"+r,m[1],4)+Txt("D"+r,m[2],3)+Txt("E"+r,m[3],4)+'</row>');
  });
  rows.push('<row r="9"/>');
  rows.push('<row r="10" ht="20" customHeight="1">'+Txt("A10",T("报价明细","Quote Details"),2)+'</row>');
  var curHdr=LANG==="zh" ? "金额（"+cur+"）" : "Amount ("+cur+")";
  rows.push('<row r="11">'+Txt("A11",T("项目","Item"),6)+Txt("B11",T("单价","Unit Price"),6)+Txt("C11",T("数量","Qty"),6)+Txt("D11",curHdr,6)+'</row>');
  rows.push('<row r="12">'+Txt("A12",T("产品成本","Product Cost"),7)+

  var freightLbl = d.mode === "air"

    : T("整票运费（海运）","Freight (Sea Shipping)");
  rows.push('<row r="13">'+Txt("A13",freightLbl,7)+
    C("B13",Math.round(d.unitFreight*100)/100,8)+C("C13",d.qty,8)+C("D13",Math.round(d.freightTotal*100)/100,8)+'</row>');
  rows.push('<row r="14" ht="20" customHeight="1">'+Txt("A14",T("客户单价 / 总价","Unit Price / Total"),9)+
    C("B14",Math.round(d.unitPrice*100)/100,10)+C("C14",d.qty,10)+C("D14",Math.round(d.total*100)/100,10)+'</row>');
  rows.push('<row r="15"/>');
  rows.push('<row r="16" ht="20" customHeight="1">'+Txt("A16",T("条款与备注","Terms & Notes"),2)+'</row>');
  var noteTxt=d.notes.join("\n");
  rows.push('<row r="17" ht="150" customHeight="1">'+Txt("A17",noteTxt,5)+'</row>');
  var merges=['A1:H1','A2:H2','A10:H10','A16:H16','A17:H21'];
  var cols='<cols><col min="1" max="1" width="36" customWidth="1"/><col min="2" max="2" width="16" customWidth="1"/>'+
    '<col min="3" max="3" width="9" customWidth="1"/><col min="4" max="4" width="20" customWidth="1"/>'+
    '<col min="5" max="5" width="14" customWidth="1"/><col min="6" max="6" width="10" customWidth="1"/>'+
    '<col min="7" max="7" width="10" customWidth="1"/><col min="8" max="8" width="10" customWidth="1"/></cols>';
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    cols+'<sheetData>'+rows.join("")+'</sheetData>'+
    '<mergeCells count="'+merges.length+'">'+merges.map(function(m){return '<mergeCell ref="'+m+'"/>';}).join("")+'</mergeCells>'+
    '</worksheet>';
}

var toastTimer=null;
function showToast(msg){
  var t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove("show"); }, 2800);
}

$("exportBtn").addEventListener("click", function(){
  if(quoteInProgress || quoteDirty){
    showToast(T("请先点击“查看报价”，等待本次报价完成后再导出","Click View Quote and wait for this quote to finish before exporting"));
    return;
  }
  if(modeSel.value==="air" && !liveBestRate()){
    showToast(T("尚未取得当前参数的4PX实时空运价，不能导出空运报价单","No live 4PX air rate is available for the current inputs; air quotation cannot be exported"));
    return;
  }
  var d=computeQuotation();
  if(!d.ok){ showToast(d.msg); return; }
  var bytes=buildQuotationXlsx(d);
  var blob=new Blob([bytes], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url; a.download=d.fileName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  showToast(T("已生成报价单："+d.fileName,"Quotation exported: "+d.fileName));
});
